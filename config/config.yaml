# ===========================================================================
#  Single source of truth for every tunable in the pipeline.
#
#  Anything an examiner might ask "where does that number come from?" about
#  lives here, not scattered across the jobs. Producers, the Spark jobs, the
#  Airflow DAG and the API all load this same file.
# ===========================================================================

# ---------------------------------------------------------------------------
# Simulated clock
#
# 1 simulated day = 300 real seconds (5 real minutes)  ->  compression 288x.
# A meter emits every 2 real seconds, so:
#     readings per meter per simulated day = 300 / 2         = 150
#     simulated time covered by one reading = 86400 / 150    = 576 s = 9.6 min
#
# This matters for window sizing: a "1 minute" window in simulated time would
# be smaller than the gap between two readings and would mostly be empty. The
# windows below are therefore expressed in SIMULATED minutes and chosen to
# contain several readings per meter.
# ---------------------------------------------------------------------------
simulation:
  sim_day_real_seconds: 300        # 5 real minutes per simulated day
  meter_interval_seconds: 2        # real-time emit cadence per meter
  sim_epoch_start: "2026-01-01T00:00:00+05:30"   # simulated wall clock at t=0
  timezone: "Asia/Colombo"

  # A small share of readings carry an older event time, as a real meter network
  # would when a device buffers and retries. This is what gives the speed layer's
  # watermark an actual job. Kept below speed_layer.watermark_minutes so these
  # events are still counted rather than discarded as too late; config validation
  # enforces that relationship.
  late_event_probability: 0.03
  late_event_max_sim_minutes: 20

# ---------------------------------------------------------------------------
# Grid topology
# ---------------------------------------------------------------------------
grid:
  zones:
    - name: Colombo-North
      meters: 12
      solar_penetration: 0.75      # fraction of households with rooftop PV
      base_load_kw: 1.10           # mean household draw used by the simulator
    - name: Colombo-South
      meters: 10
      solar_penetration: 0.60
      base_load_kw: 1.25
    - name: Gampaha
      meters: 9
      solar_penetration: 0.45
      base_load_kw: 0.95
    - name: Kandy
      meters: 9
      solar_penetration: 0.30
      base_load_kw: 0.85

  # Household / meter id formats. One meter per household in this model, so
  # H-101 is metered by M-101. Numbering starts at 101 to match the worked
  # example in the project plan.
  meter_id_prefix: "M-"
  household_id_prefix: "H-"

  # Rooftop PV capacity for a household that has panels.
  #
  # Sized deliberately, not picked for realism alone. A real 3 kWp rooftop on a
  # ~1.1 kW household exports heavily at midday, which drove zone renewable_pct
  # to 131% -- physically valid, but it makes "renewable contribution" unreadable
  # as a percentage and puts the 15% low-renewable alert permanently out of
  # reach. At 0.9 kW even the highest-penetration zone stays under 100% at solar
  # noon, and a solar household's daily totals land near the project plan's
  # worked example for H-101 (about 18 kWh consumed against 6 kWh generated).
  solar_panel_kw: 0.9
  load_jitter_pct: 0.25            # random variation applied to each reading

# ---------------------------------------------------------------------------
# Kafka
# ---------------------------------------------------------------------------
kafka:
  topic_readings: "meter.readings"
  partitions: 3
  # Keyed by household_id: gives an even spread across partitions. Keying by
  # grid_zone would put 12 of 40 meters on one partition (hot-spot); zone
  # aggregation is Spark's job, not the partitioner's.
  partition_key: "household_id"
  producer_acks: "all"

# ---------------------------------------------------------------------------
# Object storage layout (S3-compatible; SeaweedFS locally)
# ---------------------------------------------------------------------------
storage:
  # --- object storage: the daily tariff drop and the generated reports -------
  bucket_tariff: "tariff"
  bucket_reports: "reports"
  tariff_filename_pattern: "tariff_{sim_day}.csv"   # sim_day as YYYYMMDD

  # --- the immutable Parquet master store -----------------------------------
  # A mounted volume rather than object storage. This is the fallback the
  # project plan offers, and it was forced by three separate defects in the way
  # Spark's S3A connector interacts with SeaweedFS -- all on the *write* path,
  # all documented in docs/02-tech-stack.md. Spark still reads the tariff CSV
  # over S3, so the S3 code path is exercised; only the commit protocol was the
  # problem, and only writes use it.
  #
  # Nothing about the architecture changes: the master dataset is still
  # append-only Parquet partitioned by sim_day/grid_zone, and it is still what
  # the batch layer recomputes billing from.
  raw_root_container: "/data/raw"   # mounted into the Spark containers
  raw_root_host: "data/raw"         # the same directory seen from the host
  raw_prefix: "meter_readings"      # <root>/meter_readings/sim_day=.../grid_zone=...
  raw_partition_cols: ["sim_day", "grid_zone"]

# ---------------------------------------------------------------------------
# Speed layer (Spark Structured Streaming) -- values in SIMULATED time
# ---------------------------------------------------------------------------
speed_layer:
  window_minutes: 60               # 1 simulated hour  (~12.5 real seconds)
  watermark_minutes: 30            # tolerate ~3 readings' worth of lateness
  trigger_seconds: 5               # real-time micro-batch cadence

# ---------------------------------------------------------------------------
# Spark
# ---------------------------------------------------------------------------
spark:
  # Structured Streaming checkpoints go to a docker volume, NOT to object
  # storage. A checkpoint needs atomic rename and read-after-write consistency;
  # S3 only emulates rename by copying, which makes checkpoint commits slow and,
  # on an interrupted write, corruptible. The data goes to S3; the offsets stay
  # on a real filesystem.
  checkpoint_root: "/checkpoints"

  # Real seconds between micro-batches in the raw sink. One Parquet file is
  # written per partition per batch, so a tighter trigger buys lower latency at
  # the cost of many small files -- and the raw store has no latency requirement,
  # only a completeness one.
  raw_sink_trigger_seconds: 15

# ---------------------------------------------------------------------------
# Alert thresholds
# ---------------------------------------------------------------------------
alerts:
  # Daytime renewable contribution below this % raises a WARN.
  low_renewable_pct: 15.0
  daytime_start_hour: 6            # simulated local hour, inclusive
  daytime_end_hour: 18             # simulated local hour, exclusive
  # Zone load above this many kW in a window raises a WARN (overload proxy).
  zone_overload_kw: 45.0
  # Health check: no readings at all for this many real seconds -> CRITICAL.
  no_data_real_seconds: 30

# ---------------------------------------------------------------------------
# Billing (batch layer). Worked example from the project plan:
#   H-101: consumption 18 kWh, solar 6 kWh, rate 45, subsidy on
#   net = max(18-6,0) = 12 ; gross = 540 ; subsidy = 54 ; net_amount = 486
# ---------------------------------------------------------------------------
billing:
  currency: "LKR"
  # Net metering, import-only: exported surplus is not paid out, it just
  # cannot push the billable units below zero.
  net_metering: "import_only"
  subsidy_pct: 0.10
  tiers:
    domestic-1:
      rate: 30.0
    domestic-2:
      rate: 45.0
    domestic-3:
      rate: 62.0
  tier_weights:                    # how the generator assigns tiers
    domestic-1: 0.35
    domestic-2: 0.45
    domestic-3: 0.20
  subsidy_probability: 0.30        # share of households flagged for subsidy
  rate_jitter_pct: 0.05            # +/- 5% daily variation on the tier rate

# ---------------------------------------------------------------------------
# Logging / observability
# ---------------------------------------------------------------------------
logging:
  level: "INFO"
  format: "json"                   # structlog JSON renderer
  # Every component stamps this correlation id on each log line and on the
  # rows it writes, so serving-layer data is traceable to a pipeline run.
  run_id_env_var: "SG_RUN_ID"
