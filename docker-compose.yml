# ===========================================================================
#  Smart Grid Energy Monitoring & Billing  --  Lambda Architecture stack
#
#  Phase 0 brings up the three infrastructure pillars:
#    kafka      -> ingestion bus              (speed layer entry point)
#    seaweedfs  -> S3-compatible object store (raw master store + tariff drop)
#    postgres   -> serving layer              (zone_metrics, daily_bill, alerts)
#
#  Phase 2 adds  raw-sink     -> Kafka -> partitioned Parquet master store
#  Phase 3 adds  speed-layer  -> windowed zone metrics + alerts -> Postgres
#                api          -> FastAPI real-time metrics endpoints
#  Phase 4 adds  airflow        -> the daily billing DAG (batch layer)
#                billing-batch -> the batch job itself, run on demand
#  Phase 5 adds  grafana        -> live zone + daily billing dashboards
#  Phase 6 adds  prometheus     -> metrics scraping + health-check alert rules
# ===========================================================================

name: ${COMPOSE_PROJECT_NAME:-smartgrid}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # -------------------------------------------------------------------------
  # Kafka in KRaft mode: one node acting as both broker and controller, so no
  # Zookeeper container is needed.
  #
  # Deliberately NOT persisted to a named volume: in a Lambda architecture Kafka
  # is a transport buffer, not the system of record. The immutable master
  # dataset lives as Parquet in object storage (Phase 2), so a broker restart
  # losing buffered events is acceptable -- and it keeps this file free of the
  # volume-ownership problems the Kafka image has on Windows hosts.
  # -------------------------------------------------------------------------
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.9.0}
    container_name: sg-kafka
    hostname: kafka
    logging: *default-logging
    ports:
      - "29092:29092"   # host-facing listener, for producers on your machine
    environment:
      # Must be a base64-encoded 16-byte UUID (22 chars), not a descriptive
      # name -- KRaft formats its metadata log with it and refuses anything else.
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-5L6g3nShT-eMCtK--X86sw}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Empty host (`://:9092`) binds all interfaces. Writing 0.0.0.0 here fails:
      # Kafka derives advertised.listeners for any listener not named in
      # KAFKA_ADVERTISED_LISTENERS -- the CONTROLLER one -- from this value, and
      # rejects 0.0.0.0 as a nonroutable meta-address.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      # Single-broker cluster -> every replication factor must be 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are created by kafka-init
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # -------------------------------------------------------------------------
  # One-shot: create the meter-readings topic, then exit 0.
  # Partitioned by household_id (see config/config.yaml) for an even key spread.
  # -------------------------------------------------------------------------
  kafka-init:
    image: ${KAFKA_IMAGE:-apache/kafka:3.9.0}
    container_name: sg-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      TOPIC: ${KAFKA_TOPIC_READINGS:-meter.readings}
      PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic "$$TOPIC" \
          --partitions "$$PARTITIONS" --replication-factor 1
        echo "--- topics now on the broker ---"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic "$$TOPIC"
    restart: "no"

  # -------------------------------------------------------------------------
  # SeaweedFS: S3-compatible object storage.
  #   tariff/  -> the once-per-simulated-day tariff CSV drop (Phase 1)
  #   reports/ -> generated daily billing reports (Phase 4)
  #
  # The Parquet master store is NOT here: it lives on a mounted volume, because
  # Spark cannot commit a write to SeaweedFS. See docs/02-tech-stack.md.
  #
  # Why not MinIO: MinIO withdrew its public container images, so `minio/minio`
  # and `quay.io/minio/minio` can no longer be pulled without a licence. The
  # code only ever speaks the S3 API, so replacing the provider was a change to
  # this file -- see docs/02-tech-stack.md.
  #
  # `server -s3 -filer` runs master, volume, filer and the S3 gateway in one
  # process, which is what keeps this a single container.
  # -------------------------------------------------------------------------
  seaweedfs:
    image: ${S3_IMAGE:-chrislusf/seaweedfs:3.80}
    container_name: sg-seaweedfs
    hostname: seaweedfs
    logging: *default-logging
    command: >
      server -dir=/data -s3 -filer
      -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=256
    ports:
      - "8333:8333"   # S3 API
      - "8888:8888"   # filer web UI: browse buckets and objects
    volumes:
      - seaweed-data:/data
      # Without this the S3 gateway accepts any access key, making the
      # credentials in .env decorative.
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    # No healthcheck: the image ships the `weed` binary and little else, so any
    # in-image HTTP probe is guesswork. Readiness is gated by storage-init's
    # own retry loop below, which uses a container that definitely has a client.

  # -------------------------------------------------------------------------
  # One-shot: wait for the S3 gateway, create the three buckets, then exit 0.
  # Anything in a later phase that needs the buckets should depend on this with
  # `condition: service_completed_successfully`.
  # -------------------------------------------------------------------------
  storage-init:
    image: ${AWSCLI_IMAGE:-amazon/aws-cli:latest}
    container_name: sg-storage-init
    depends_on:
      seaweedfs:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-smartgrid}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-smartgridsecret}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      BUCKETS: ${S3_BUCKET_TARIFF:-tariff} ${S3_BUCKET_REPORTS:-reports}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until aws s3 ls --endpoint-url "$$S3_ENDPOINT" >/dev/null 2>&1; do
          echo "waiting for the S3 gateway..."; sleep 3
        done
        for b in $$BUCKETS; do
          aws s3 mb "s3://$$b" --endpoint-url "$$S3_ENDPOINT" 2>/dev/null \
            || echo "bucket $$b already exists"
        done
        echo "--- buckets now in object storage ---"
        aws s3 ls --endpoint-url "$$S3_ENDPOINT"
    restart: "no"

  # -------------------------------------------------------------------------
  # PostgreSQL: the Lambda serving layer. Both the speed layer and the batch
  # layer write here, and both FastAPI and Grafana read from here.
  # The schema is applied once, on first start, from infra/postgres/init/.
  # -------------------------------------------------------------------------
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: sg-postgres
    hostname: postgres
    logging: *default-logging
    ports:
      # Host-side port is configurable because a locally installed PostgreSQL
      # commonly already owns 5432. Docker still binds successfully in that case
      # on Windows, so the symptom is not "port in use" -- it is host tools
      # silently authenticating against the wrong server. Inside the compose
      # network the port is always 5432.
      - "${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartgrid}
      POSTGRES_USER: ${POSTGRES_USER:-grid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridpass}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # -------------------------------------------------------------------------
  # Phase 2 -- the raw master store.
  #
  # A Spark Structured Streaming job reading Kafka and appending Parquet to
  # object storage, partitioned by sim_day/grid_zone. This is the dataset the
  # batch layer recomputes billing from, which is what makes the batch layer
  # authoritative rather than just another consumer.
  #
  # Runs in local[2] mode: a single container acting as its own driver and
  # executor. A real cluster would separate them, but the marks here are for the
  # architecture, not for operating a Spark cluster on a laptop.
  # -------------------------------------------------------------------------
  raw-sink:
    build:
      context: ./infra/spark
    image: smartgrid/spark:3.5.3
    container_name: sg-raw-sink
    logging: *default-logging
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    environment:
      # Selects the in-network endpoints (kafka:9092, http://seaweedfs:8333)
      # over the host-facing ones.
      SG_IN_DOCKER: "1"
      PYTHONPATH: /app
      KAFKA_INTERNAL_BOOTSTRAP: ${KAFKA_INTERNAL_BOOTSTRAP:-kafka:9092}
      KAFKA_TOPIC_READINGS: ${KAFKA_TOPIC_READINGS:-meter.readings}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-smartgrid}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-smartgridsecret}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET_TARIFF: ${S3_BUCKET_TARIFF:-tariff}
    volumes:
      # Read-only source mounts: edit a job on the host and restart the service.
      - ./common:/app/common:ro
      - ./processing:/app/processing:ro
      - ./config:/app/config:ro
      # The Parquet master store. A bind mount rather than a named volume so the
      # partition directories are directly browsable on the host, which also
      # lets the verification script read them without Docker.
      - ./data/raw:/data/raw
      - spark-checkpoints:/checkpoints
    working_dir: /app
    ports:
      - "4040:4040"      # Spark UI: streaming query progress, stages, storage
    # 512m, not the 1g this started with. Measured working set is ~450 MB: one
    # micro-batch of ~1,200 rows and the Parquet writer. The headroom matters
    # because Phase 4's batch job needs a JVM of its own, and the whole stack
    # shares one 3.7 GB Docker VM on an 8 GB laptop -- see the README's
    # "What Phase 4 decides" note on memory.
    command: >
      /opt/spark/bin/spark-submit
      --master local[2]
      --driver-memory 512m
      /app/processing/raw_sink.py
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Phase 3 -- the speed layer.
  #
  # Spark Structured Streaming over Kafka: event-time tumbling windows per grid
  # zone, upserted into `zone_metrics`, with threshold rules appending to
  # `alerts`. Runs in update mode, so the window in progress is visible and is
  # corrected in place as late events arrive.
  #
  # A second Spark container rather than a second query inside raw-sink: the two
  # jobs have different failure modes and different restart semantics. The raw
  # sink is the master dataset and must not be interrupted by a bug in an alert
  # rule, and each query keeps its own checkpoint so either can be replayed
  # alone.
  # -------------------------------------------------------------------------
  speed-layer:
    build:
      context: ./infra/spark
    image: smartgrid/spark:3.5.3
    container_name: sg-speed-layer
    logging: *default-logging
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      SG_IN_DOCKER: "1"
      PYTHONPATH: /app
      KAFKA_INTERNAL_BOOTSTRAP: ${KAFKA_INTERNAL_BOOTSTRAP:-kafka:9092}
      KAFKA_TOPIC_READINGS: ${KAFKA_TOPIC_READINGS:-meter.readings}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-smartgrid}
      POSTGRES_USER: ${POSTGRES_USER:-grid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridpass}
    volumes:
      - ./common:/app/common:ro
      - ./processing:/app/processing:ro
      - ./config:/app/config:ro
      - spark-checkpoints:/checkpoints
    working_dir: /app
    ports:
      - "4041:4040"      # Spark UI; 4040 is already taken by raw-sink
    # 512m for the same reason as raw-sink: the state this query holds is four
    # zones times a handful of open windows.
    command: >
      /opt/spark/bin/spark-submit
      --master local[2]
      --driver-memory 512m
      /app/processing/speed_layer.py
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Phase 3 -- the real-time API.
  #
  # Reads only. All aggregation belongs to the layer that owns the stream; an API
  # that recomputed it would be a second implementation free to disagree.
  # -------------------------------------------------------------------------
  api:
    build:
      context: ./infra/api
    image: smartgrid/api:0.3.0
    container_name: sg-api
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SG_IN_DOCKER: "1"
      PYTHONPATH: /app
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-smartgrid}
      POSTGRES_USER: ${POSTGRES_USER:-grid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridpass}
    volumes:
      - ./common:/app/common:ro
      - ./config:/app/config:ro
      - ./serving:/app/serving:ro
    working_dir: /app
    ports:
      - "${API_PORT:-8000}:8000"
    command: >
      uvicorn serving.api.main:app
      --host 0.0.0.0 --port 8000
      --log-level ${API_LOG_LEVEL:-info}
    healthcheck:
      # /health returns 200 whenever the database is reachable, so this probes
      # the API and its dependency without going red every time the producer is
      # stopped -- which is a normal state during a demo, not a broken API.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Phase 4 -- the batch layer, as a one-shot job.
  #
  # `profiles: ["manual"]` keeps it out of `docker compose up`: this is not a
  # service, it is a run. Airflow normally triggers the same job inside its own
  # container; this service is how a human runs it directly, which is what the
  # Phase 4 walkthrough does before involving the scheduler.
  #
  #     docker compose run --rm billing-batch                     # the day that just closed
  #     docker compose run --rm billing-batch --sim-day 20260121
  #
  # The entrypoint is spark-submit, so anything after the service name is an
  # argument to the job rather than a new command line.
  # -------------------------------------------------------------------------
  billing-batch:
    profiles: ["manual"]
    build:
      context: ./infra/spark
    image: smartgrid/spark:3.5.3
    logging: *default-logging
    environment:
      SG_IN_DOCKER: "1"
      PYTHONPATH: /app
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-smartgrid}
      POSTGRES_USER: ${POSTGRES_USER:-grid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridpass}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-smartgrid}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-smartgridsecret}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET_TARIFF: ${S3_BUCKET_TARIFF:-tariff}
      S3_BUCKET_REPORTS: ${S3_BUCKET_REPORTS:-reports}
    volumes:
      - ./common:/app/common:ro
      - ./processing:/app/processing:ro
      - ./config:/app/config:ro
      # Both paths onto ./data, for the same reason as the airflow service:
      # /app/data is where the simulated clock looks for .sim_anchor, and
      # /data/raw is the master store as config.yaml names it inside containers.
      - ./data:/app/data
      - ./data:/data
    working_dir: /app
    entrypoint:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      # Matching the DAG, which runs the same job in a tighter container.
      - --driver-memory
      - 512m
      - /app/processing/billing_batch.py
    restart: "no"

  # -------------------------------------------------------------------------
  # Phase 4 -- Airflow's metadata database.
  #
  # Airflow needs a database of its own for LocalExecutor (SQLite only supports
  # the SequentialExecutor, which cannot run two tasks at once). It gets a second
  # database inside the existing Postgres rather than a second container: one less
  # service for a laptop, and the isolation that matters -- Airflow's tables and
  # the serving tables never mixing -- is what a separate database gives.
  #
  # Not done in infra/postgres/init/, because those scripts only run when the
  # data volume is created; this way an existing stack gains Phase 4 without
  # being wiped.
  # -------------------------------------------------------------------------
  airflow-db-init:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: sg-airflow-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-grid}
      PGPASSWORD: ${POSTGRES_PASSWORD:-gridpass}
      PGDATABASE: ${POSTGRES_DB:-smartgrid}
      AIRFLOW_DB: ${AIRFLOW_DB:-airflow}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if psql -tAc "SELECT 1 FROM pg_database WHERE datname='$$AIRFLOW_DB'" | grep -q 1; then
          echo "metadata database $$AIRFLOW_DB already exists"
        else
          psql -c "CREATE DATABASE $$AIRFLOW_DB OWNER $$PGUSER"
          echo "created metadata database $$AIRFLOW_DB"
        fi
    restart: "no"

  # -------------------------------------------------------------------------
  # Phase 4 -- Airflow: the batch layer's scheduler.
  #
  # `airflow standalone` runs the scheduler, the webserver and the triggerer in
  # one process. Three containers is the production shape; one is the right shape
  # for a single DAG on a laptop that is already running two Spark drivers.
  #
  # This image carries PySpark, so the DAG runs the billing job as a subprocess
  # rather than asking the Docker daemon to start another container -- reasoning
  # in infra/airflow/Dockerfile.
  # -------------------------------------------------------------------------
  airflow:
    build:
      context: ./infra/airflow
    image: smartgrid/airflow:2.10.3
    container_name: sg-airflow
    logging: *default-logging
    depends_on:
      airflow-db-init:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    environment:
      SG_IN_DOCKER: "1"
      PYTHONPATH: /app
      # --- the serving layer the billing job writes to ---------------------
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-smartgrid}
      POSTGRES_USER: ${POSTGRES_USER:-grid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridpass}
      # --- object storage: the tariff input and the report output -----------
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-smartgrid}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-smartgridsecret}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET_TARIFF: ${S3_BUCKET_TARIFF:-tariff}
      S3_BUCKET_REPORTS: ${S3_BUCKET_REPORTS:-reports}
      # --- Airflow itself ---------------------------------------------------
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-grid}:${POSTGRES_PASSWORD:-gridpass}@postgres:5432/${AIRFLOW_DB:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Paused on creation, which is Airflow's own default and the right one here.
      # Unpaused, this DAG starts a Spark JVM every five real minutes for as long
      # as the stack is up. On an 8 GB laptop that is enough to get the Airflow
      # webserver OOM-killed mid-billing ("Worker was sent SIGKILL! Perhaps out of
      # memory?"), and before the producer is running it also fills the run history
      # with red runs whose tariff file was never written. Billing is started
      # deliberately instead:
      #     docker compose exec airflow airflow dags unpause daily_billing
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      # Picked up quickly after an edit on the host; the default is 5 minutes.
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "30"
      # One DAG file, so a second parsing process is pure overhead -- and this
      # container has to leave room for the Spark driver the billing task starts.
      AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1"
      # The default is 4 gunicorn workers. One is enough for a single DAG, and
      # the memory matters: this container also hosts the Spark driver that the
      # billing task starts, inside a Docker VM with 3.7 GB in total.
      AIRFLOW__WEBSERVER__WORKERS: "1"
      # Both defaults are 120s, and both were exceeded on this laptop: the
      # webserver logged "No response from gunicorn master within 120 seconds"
      # and shut itself down while the scheduler carried on running the DAG. A
      # bind-mounted dags folder on Docker Desktop is slow enough that importing
      # the provider packages takes longer than that.
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: "300"
      AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: "300"
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    volumes:
      - ./orchestration/dags:/opt/airflow/dags:ro
      - ./common:/app/common:ro
      - ./processing:/app/processing:ro
      - ./config:/app/config:ro
      # ./data twice, at two paths, for two different readers of the same files:
      #   /app/data  -- where common/sim_clock.py looks for .sim_anchor, since the
      #                 project root inside this container is /app
      #   /data      -- the Parquet master store at the path config.yaml gives
      #                 containers (storage.raw_root_container)
      - ./data:/app/data
      - ./data:/data
      - airflow-logs:/opt/airflow/logs
    working_dir: /app
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    command:
      - bash
      - -c
      - |
        set -e
        airflow db migrate
        # A known password instead of the random one `airflow standalone` writes to
        # a file inside the container. `|| true` because the user survives a
        # restart while this command does not know that.
        airflow users create --role Admin           --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}"           --firstname Smart --lastname Grid --email admin@smartgrid.local || true
        exec airflow standalone
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 10
      # The first start runs the migrations and boots three Airflow components.
      start_period: 300s
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Phase 5 -- Grafana: the dashboards over the serving layer.
  #
  # Reads Postgres directly, like the API: the speed layer's zone_metrics and
  # alerts, and the batch layer's daily_bill, side by side in one tool. The
  # datasource and both dashboards are provisioned from observability/grafana/,
  # so a fresh clone gets working dashboards with no clicking. No named volume:
  # everything worth keeping is in those files, and Grafana's own SQLite only
  # holds sessions and preferences.
  # -------------------------------------------------------------------------
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.3.0}
    container_name: sg-grafana
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Read by provisioning/datasources/postgres.yml.
      POSTGRES_DB: ${POSTGRES_DB:-smartgrid}
      POSTGRES_USER: ${POSTGRES_USER:-grid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridpass}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/live_zone_monitoring.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Phase 6 -- Prometheus: metrics and operational alert rules.
  #
  # Scrapes the API (serving lag, pipeline runs) and the host-side producer
  # (events/s, send errors), and evaluates observability/prometheus/
  # alert_rules.yml -- including the "no meter data" health check. No
  # Alertmanager: firing alerts are shown in Prometheus and in Grafana, which is
  # what this project needs; routing them to email or Slack would be the next step.
  # -------------------------------------------------------------------------
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.55.1}
    container_name: sg-prometheus
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Short retention: this is a demo stack, and metrics only need to cover it.
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    # Docker Desktop resolves host.docker.internal on its own; on Linux this
    # mapping is what lets Prometheus reach the producer on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  seaweed-data:
  postgres-data:
  spark-checkpoints:
  # Airflow's task logs. A named volume rather than a bind mount: Airflow writes
  # them as uid 50000, and a host-mounted log tree is the usual source of
  # permission errors on Windows and Linux alike. Read them from the UI, or with
  # `docker compose logs airflow`.
  airflow-logs:
