# Phase 6: Prometheus as Grafana's second datasource, for the Pipeline Health
# dashboard. The fixed uid is what that dashboard's JSON references.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: sg-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: false
    jsonData:
      timeInterval: 10s
