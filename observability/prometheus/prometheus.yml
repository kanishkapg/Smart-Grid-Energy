# Phase 6: what Prometheus scrapes, and where its alert rules live.
#
# 10 s scrapes: the speed layer commits a zone window roughly every 12 real
# seconds, so anything slower would blur the "no data" health check.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  # The serving layer: zone gauges, freshness lag, alert and pipeline-run counts.
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  # The meter producer runs on the host, not in Docker. host.docker.internal is
  # the host as seen from a container (mapped for Linux in docker-compose.yml).
  - job_name: producer
    static_configs:
      - targets: ["host.docker.internal:9101"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
